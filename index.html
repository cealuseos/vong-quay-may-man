<!doctype html>
<html lang="vi"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Vòng Quay May Mắn</title><style>@import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;700;800&family=Playfair+Display:wght@700;800&display=swap');:root{--navy:#071c38;--gold:#f8c85b;--cream:#fff9eb;--red:#e54c45;} body{background:radial-gradient(circle at 50% -8%,#1a5a91 0,#0b3565 27%,var(--navy) 70%); color:var(--cream); font-family:"Be Vietnam Pro",sans-serif; margin:0; padding:20px;} .page{max-width:1000px;margin:auto;} header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;} .admin-action{padding:8px 12px;background:#ffffff15;border:1px solid #fff3;color:white;cursor:pointer;border-radius:8px;} .admin-only{display:none!important} body.is-admin .admin-only{display:flex!important} h1{font-family:"Playfair Display",serif;text-align:center;color:var(--gold);font-size:3rem;margin:20px 0;} .layout{display:grid;grid-template-columns:1fr 1fr;gap:20px;} @media(max-width:768px){.layout{grid-template-columns:1fr}} .panel{background:#ffffff0a;border:1px solid #ffffff1a;border-radius:20px;padding:20px;margin-bottom:20px;} .wheel-wrap{width:100%;aspect-ratio:1;border-radius:50%;background:#164775;position:relative;display:grid;place-items:center;box-shadow:0 0 0 10px #f8c85b44;} #wheel{width:90%;height:90%;transition:transform 5s cubic-bezier(.1,.7,.1,1);} .hub{position:absolute;width:60px;height:60px;background:var(--gold);border-radius:50%;color:#44270d;display:grid;place-items:center;font-weight:800;} .promo-banner{width:100%;border-radius:15px;margin-top:20px;display:block;} .prize-img{width:80px;height:80px;border-radius:10px;object-fit:cover;margin-right:15px;} .prize-box{display:flex;align-items:center;padding:15px;background:#ffffff0a;border-radius:15px;} input,button{padding:10px;border-radius:8px;border:none;margin:5px 0;} input{background:#06182f;color:white;width:100%;} button{background:var(--gold);color:var(--navy);font-weight:800;cursor:pointer;width:100%;} .modal{display:none;position:fixed;inset:0;background:#0008;place-items:center;} .modal.show{display:grid;} .modal-card{background:var(--navy);padding:20px;border-radius:15px;width:300px;}</style></head>
<body><main class="page"><header><div>VÒNG QUAY</div><button id="adminButton" class="admin-action">Quản trị</button></header><h1>Vòng Quay May Mắn</h1><section class="layout"><section><div class="panel wheel-wrap"><canvas id="wheel" width="800" height="800"></canvas><div class="hub">✦</div></div><a id="promoLink" target="_blank"><img id="promoImage" class="promo-banner" src="" alt="Banner"></a></section><aside><div class="panel"><h3>Quay sau</h3><div id="time" style="font-size:2rem;color:var(--gold)">00:00</div><div class="admin-only round-actions"><button id="spinNow">Quay ngay</button><button id="resetRound" style="background:#e54c45;color:white">Vòng mới</button></div></div><div class="panel"><form id="joinForm"><input id="playerName" placeholder="Tên" required><input id="chosenNumber" type="number" placeholder="Số" required><input id="socialLink" placeholder="Link Zalo/FB"><button type="submit">Chọn số</button></form></div><div class="panel prize-box"><img id="prizeImage" src="prize.png" class="prize-img"><div class="prize-info"><h3>Giải thưởng</h3><strong style="color:var(--gold)">Quà tặng may mắn</strong><label class="admin-only"><input id="prizeUpload" type="file" accept="image/*" style="display:none">↥ Đổi ảnh</label></div></div><div class="panel"><h3>Danh sách</h3><div id="entryList"></div></div></aside></section></main>
<div class="modal" id="adminModal"><form id="adminLogin" class="modal-card"><input id="adminUsername" placeholder="User" required><input id="adminPassword" type="password" placeholder="Pass" required><button type="submit">Đăng nhập</button></form></div>
<script>
    let entries=[], serverToken=''; const el=id=>document.getElementById(id), canvas=el('wheel'), ctx=canvas.getContext('2d');
    async function request(p,o={}){const r=await fetch(p,{...o,headers:{'Content-Type':'application/json','x-admin-token':serverToken,...(o.headers||{})}});const d=await r.json();if(!r.ok)throw new Error(d.error);return d}
    function drawWheel(){ const n=entries.length; if(!n)return; const a=Math.PI*2/n; entries.forEach((e,i)=>{const s=i*a-Math.PI/2;ctx.beginPath();ctx.moveTo(400,400);ctx.arc(400,400,400,s,s+a);ctx.fillStyle=['#e85146','#f4b942','#1b9c91','#356db0'][i%4];ctx.fill();ctx.save();ctx.translate(400,400);ctx.rotate(s+a/2);ctx.fillStyle='#fff';ctx.font='30px Arial';ctx.fillText(e.number,300,10);ctx.restore();}); }
    function render(s){ entries=s.entries||[]; el('entryList').innerHTML=entries.map(x=>`<div>${x.name}: Số ${x.number}</div>`).join(''); if(s.prizeImage)el('prizeImage').src=s.prizeImage; if(s.promoImage){el('promoImage').src=s.promoImage;el('promoLink').href=s.promoUrl||'#'} drawWheel(); }
    el('joinForm').onsubmit=async e=>{e.preventDefault();try{render(await request('/api/join',{method:'POST',body:JSON.stringify({name:el('playerName').value,number:Number(el('chosenNumber').value),social:el('socialLink').value})}))}catch(e){alert(e.message)}};
    el('prizeUpload').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{try{render(await request('/api/admin/save-images',{method:'POST',body:JSON.stringify({prizeImage:r.result})}))}catch(e){alert(e.message)}};r.readAsDataURL(f)};
    el('adminButton').onclick=()=>{if(document.body.classList.contains('is-admin')){document.body.classList.remove('is-admin');serverToken=''}else el('adminModal').classList.add('show')};
    el('adminLogin').onsubmit=async e=>{e.preventDefault();try{const d=await request('/api/admin/login',{method:'POST',body:JSON.stringify({username:el('adminUsername').value,password:el('adminPassword').value})});serverToken=d.token;document.body.classList.add('is-admin');el('adminModal').classList.remove('show')}catch(e){alert(e.message)}};
    setInterval(async()=>{try{render(await request('/api/state'))}catch{}},2000);
</script></body></html>
